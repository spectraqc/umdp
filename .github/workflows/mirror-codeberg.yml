name: Mirror to Codeberg

# GitHub stays canonical; Codeberg is a read-only mirror. See SQC-1893.

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: mirror-codeberg
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and tags to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "CODEBERG_TOKEN is not set — skipping mirror."
            exit 0
          fi
          # Keep the token out of the remote URL so it cannot leak via git errors.
          git config --global credential.helper store
          printf 'https://x-access-token:%s@codeberg.org\n' "$CODEBERG_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git remote add codeberg https://codeberg.org/spectraqc/umdp.git
          git push --force codeberg refs/remotes/origin/main:refs/heads/main
          git push --force --tags codeberg
